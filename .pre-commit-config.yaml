repos:
  - repo: local
    hooks:
      - id: gen-reqs
        name: gen requirements from Pipfile
        language: system
        entry: make
        args: ["gen-reqs"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
